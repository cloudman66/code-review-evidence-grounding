[project]
name = "code-review-understanding"
version = "1.0.5"
description = "Lightweight research scaffold for code review understanding on a local Mac."
requires-python = ">=3.11"
dependencies = [
  "fastembed>=0.7.3",
  "matplotlib>=3.10.0",
  "openpyxl>=3.1.5",
  "pyarrow>=21.0.0",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
biencoder = [
  "sentence-transformers==3.4.1",
  "torch==2.6.0",
]

[tool.uv]
package = false
