dataset:
  train_path: data/processed/swe_care_grounding/train.jsonl
  dev_path: data/processed/swe_care_grounding/dev.jsonl
  test_path: data/processed/swe_care_grounding/test.jsonl

retrieval:
  top_k: 3

fusion:
  normalization: raw
  models:
    - score_cache_path_by_split:
        dev: results/cache/swe_care_diff_dev.json.gz
        test: results/cache/swe_care_diff_test.json.gz
      weight: 1.0
    - score_cache_path_by_split:
        dev: results/cache/swe_care_file_dev.json.gz
        test: results/cache/swe_care_file_test.json.gz
      weight: 0.4

output:
  dir: results/swe_care_score_fusion_diff_file_devbest
